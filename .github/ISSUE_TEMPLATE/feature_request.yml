name: Feature Request / 功能请求
description: Suggest an idea or improvement for this project / 为这个项目提出一个想法或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea! Please describe your feature or improvement in detail.  
        感谢你提出建议！请详细描述你的功能或改进。

  - type: dropdown
    id: suggestion_type
    attributes:
      label: Suggestion Type / 建议类型
      description: Which category does your suggestion belong to? / 你的建议属于哪一类？
      options:
        - New Feature / 新功能
        - Enhancement / 现有功能优化
        - Compatibility / 兼容性
        - Performance / 性能改进
        - Other (please describe below) / 其他（请在下文描述）
    validations:
      required: true

  # 新增字段：模组联动兼容性
  - type: textarea
    id: mod_compatibility
    attributes:
      label: Mod Compatibility (if any) / 模组兼容性（如果有）
      description: If this feature suggestion involves compatibility with other mods, please list the relevant mod names. / 如果这个功能建议涉及与其他模组的联动兼容，请列出相关模组名称。
      placeholder: |
        e.g.Create, etc.
        例如：机械动力等。

  - type: dropdown
    id: minecraft_version
    attributes:
      label: Minecraft Version / Minecraft 版本
      description: If this suggestion is for specific Minecraft versions, select it / 如果该建议针对特定 Minecraft 版本，请选择
      multiple: true
      options:
        - 1.20.1
        - 1.21.1
        - All versions / 所有版本

  - type: textarea
    id: problem_description
    attributes:
      label: Problem or Background / 相关痛点或背景
      description: What problem does this solve? Or describe the context. / 这个建议是为了解决什么问题？或者描述一下背景。
      placeholder: |
        e.g., When I try to... in multiplayer, the operation is not intuitive...
        例如：当我在多人服务器中尝试...时，操作不够直观...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / 期望的解决方案
      description: What change or new feature would you like to see? / 你希望看到什么样的变化或新功能？
      placeholder: |
        e.g., Add a config option to adjust the delay of...
        例如：增加一个配置选项，可以调整...的延迟时间。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered / 考虑的替代方案（如果有）
      description: Have you considered any alternative solutions or workarounds? / 你有没有考虑过其他实现方式或临时解决办法？

  - type: input
    id: contact_details
    attributes:
      label: Contact Details / 联系方式
      description: How can we reach you for more info? / 如果需要进一步沟通，如何联系你？
      placeholder: ex. email@example.com / 例如：email@example.com